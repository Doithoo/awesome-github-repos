name: Update awesome list

on:
  workflow_dispatch:
  schedule:
    - cron: '00 00 */1 * *'

permissions: {}

concurrency:
  group: update-awesome-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test generator and UI
        run: npm run test:all

      - name: Generate awesome list
        run: npm run update-awesome-list
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.md

          if git diff --cached --quiet; then
            echo "No starred repository changes to commit."
            exit 0
          fi

          git commit -m "chore(updates): update starred repositories"
          git push
